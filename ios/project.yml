name: Kana
options:
  bundleIdPrefix: com.tommycardelo
  deploymentTarget:
    iOS: "18.0"
targets:
  Kana:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # El banco de palabras de la web, tal cual: una sola lista para las dos apps.
      - path: ../src/words.js
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Kana
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tommycardelo.kana
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RV2VS68Z9R
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KanaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Kana
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tommycardelo.kana.uitests
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: RV2VS68Z9R
        TEST_TARGET_NAME: Kana
schemes:
  Kana:
    build:
      targets:
        Kana: all
    test:
      targets:
        - KanaUITests
